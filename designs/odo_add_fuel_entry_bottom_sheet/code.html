<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Odo - Log Fuel Entry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            bg: '#0B0F0D',
            card: '#131A16',
            'card-border': '#26322C',
            raised: '#1B2420',
            textMain: '#E8F1EC',
            muted: '#8FA398',
            accent: '#22C55E',
            accentText: '#04130A',
            amberWarn: '#F59E0B',
            dangerRed: '#EF4444',
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0B0F0D;
      color: #E8F1EC;
      font-family: 'Space Grotesk', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="relative w-[390px] min-h-[844px] h-[844px] max-w-[390px] mx-auto overflow-hidden bg-bg flex flex-col justify-end antialiased">

  <!-- Dimmed & Blurred Background Representing Fuel Screen -->
  <div class="absolute inset-0 bg-bg pointer-events-none opacity-40 filter blur-[2px] p-4 flex flex-col gap-3">
    <!-- Mock Top Bar -->
    <div class="flex items-center justify-between pt-8 pb-3 border-b border-card-border/40">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-accent"></div>
        <span class="text-xs font-mono tracking-wider text-muted uppercase">Fuel Telemetry</span>
      </div>
      <div class="px-2 py-0.5 rounded-full bg-raised text-[10px] font-mono text-accent">OFFLINE READY</div>
    </div>
    
    <!-- Hero Mock Card -->
    <div class="p-4 rounded-2xl bg-card border border-card-border mt-2">
      <div class="text-[11px] font-mono text-muted uppercase tracking-wider">Avg Econ</div>
      <div class="text-3xl font-mono font-bold text-textMain mt-1">41.8 <span class="text-sm font-normal text-muted">KM/L</span></div>
    </div>

    <!-- Feed Mock Rows -->
    <div class="p-3.5 rounded-2xl bg-card border border-card-border flex items-center justify-between">
      <div>
        <div class="text-sm font-medium">Shell FuelSave 91</div>
        <div class="text-xs text-muted font-mono mt-0.5">Nov 14, 2024</div>
      </div>
      <div class="text-right font-mono text-sm font-semibold">₱249.90</div>
    </div>
    <div class="p-3.5 rounded-2xl bg-card border border-card-border flex items-center justify-between">
      <div>
        <div class="text-sm font-medium">Petron Xtra Unleaded</div>
        <div class="text-xs text-muted font-mono mt-0.5">Nov 09, 2024</div>
      </div>
      <div class="text-right font-mono text-sm font-semibold">₱235.62</div>
    </div>
  </div>

  <!-- Bottom Sheet Backdrop Shade -->
  <div class="absolute inset-0 bg-black/75 transition-opacity"></div>

  <!-- Bottom Sheet Container -->
  <div class="relative w-full z-20 bg-card rounded-t-[28px] border-t border-x border-card-border px-5 pt-3 pb-8 flex flex-col shadow-2xl max-h-[92%] animate-in slide-in-from-bottom duration-200">
    
    <!-- Drag Handle Indicator -->
    <div class="flex justify-center pb-2">
      <div class="w-10 h-1 rounded-full bg-[#32433B]"></div>
    </div>

    <!-- Header Section -->
    <div class="flex items-center justify-between pb-3 pt-1 border-b border-card-border/60">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-raised border border-card-border flex items-center justify-center text-accent">
          <!-- Fuel Pump Icon -->
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 22V4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v18"></path>
            <path d="M13 10h4a2 2 0 0 1 2 2v7a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9a2 2 0 0 0-.586-1.414l-2.828-2.828A2 2 0 0 0 18.172 4H17"></path>
            <line x1="3" y1="22" x2="13" y2="22"></line>
            <line x1="6" y1="7" x2="10" y2="7"></line>
          </svg>
        </div>
        <div>
          <h2 class="text-base font-bold tracking-tight text-textMain">Log Fuel Entry</h2>
          <p class="text-[11px] font-mono text-muted tracking-wide">HONDA CLICK 125I</p>
        </div>
      </div>

      <!-- Close / Dismiss Ghost Button -->
      <button type="button" aria-label="Close" class="w-7 h-7 rounded-full bg-raised border border-card-border/70 flex items-center justify-center text-muted hover:text-textMain transition-colors">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Form Content -->
    <form class="flex flex-col gap-3.5 pt-4" onsubmit="event.preventDefault();">

      <!-- Field: Date & Time -->
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <label class="text-[11px] font-mono font-medium uppercase tracking-wider text-muted">Entry Date &amp; Time</label>
          
        </div>
        <div class="relative flex items-center bg-raised rounded-xl border border-card-border focus-within:border-accent transition-colors">
          <div class="pl-3.5 pr-2 text-muted">
            <!-- Calendar Icon -->
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <input type="text" value="Today, 18 Nov 2024 • 08:45 AM" class="w-full bg-transparent py-2.5 pr-3 text-sm font-mono text-textMain outline-none placeholder:text-muted/60">
          <span class="pr-3 text-[11px] font-mono font-semibold text-muted uppercase tracking-wider">PHST</span>
        </div>
      </div>

      <!-- Dual Row: Liters & Price per Liter -->
      <div class="grid grid-cols-2 gap-3">
        <!-- Liters Field -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-mono font-medium uppercase tracking-wider text-muted">Volume Filled</label>
          <div class="relative flex items-center bg-raised rounded-xl border border-card-border focus-within:border-accent transition-colors">
            <input id="input-liters" type="number" step="0.01" value="4.10" placeholder="0.00" class="w-full bg-transparent py-2.5 pl-3.5 pr-10 text-base font-mono font-bold text-textMain outline-none">
            <span class="absolute right-3.5 pointer-events-none text-xs font-mono font-semibold text-muted">L</span>
          </div>
        </div>

        <!-- Price per Liter Field -->
        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-mono font-medium uppercase tracking-wider text-muted">Rate / Liter</label>
          <div class="relative flex items-center bg-raised rounded-xl border border-card-border focus-within:border-accent transition-colors">
            <span class="pl-3.5 text-xs font-mono font-bold text-muted pointer-events-none">₱</span>
            <input id="input-rate" type="number" step="0.05" value="61.20" placeholder="0.00" class="w-full bg-transparent py-2.5 pl-1.5 pr-10 text-base font-mono font-bold text-textMain outline-none">
            <span class="absolute right-3 pointer-events-none text-xs font-mono font-semibold text-muted">/L</span>
          </div>
        </div>
      </div>

      <!-- Field: Total Cost (Auto-calculated, Read-only) -->
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <label class="text-[11px] font-mono font-medium uppercase tracking-wider text-muted">Total Pump Cost</label>
          <span class="text-[10px] font-mono text-muted bg-[#121915] px-2 py-0.5 rounded border border-card-border/70">
            AUTO-CALCULATED
          </span>
        </div>
        <div class="relative flex items-center bg-[#0F1512] rounded-xl border border-card-border/80 px-3.5 py-2.5">
          <span class="text-base font-mono font-bold text-accent mr-1">₱</span>
          <div id="display-total" class="w-full bg-transparent text-xl font-mono font-bold tracking-tight text-accent">
            250.92
          </div>
          <div class="flex items-center gap-1 text-[11px] font-mono text-muted/80 bg-raised/90 px-2 py-1 rounded-md border border-card-border">
            <svg class="w-3 h-3 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>PHP</span>
          </div>
        </div>
      </div>

      <!-- Field: Odometer in KM -->
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <label class="text-[11px] font-mono font-medium uppercase tracking-wider text-muted">Current Odometer</label>
          <span class="text-[10px] font-mono text-muted">+170 km since last fill</span>
        </div>
        <div class="relative flex items-center bg-raised rounded-xl border border-card-border focus-within:border-accent transition-colors">
          <div class="pl-3.5 pr-2 text-muted">
            <!-- Gauge / Meter mini icon -->
            <svg class="w-4 h-4 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
              <path d="M12 12L19 5"></path>
            </svg>
          </div>
          <input type="number" value="12650" placeholder="12480" class="w-full bg-transparent py-2.5 pr-12 text-base font-mono font-bold text-textMain outline-none">
          <span class="absolute right-3.5 pointer-events-none text-xs font-mono font-semibold text-muted">KM</span>
        </div>
      </div>

      <!-- Toggle: Full Tank Option -->
      <div class="flex items-center justify-between p-3.5 rounded-xl bg-raised border border-card-border hover:border-card-border/90 transition-colors">
        <div class="flex items-center gap-3">
          <div class="w-7 h-7 rounded-lg bg-card border border-card-border flex items-center justify-center text-accent">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20"></path>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
          </div>
          <div>
            <div class="text-sm font-semibold text-textMain">Full Tank Refill</div>
            <div class="text-[11px] font-mono text-muted">Calibrates consumption &amp; range algorithms</div>
          </div>
        </div>

        <!-- Custom Switch Component (Active: ON) -->
        <label class="relative inline-flex items-center cursor-pointer select-none">
          <input id="toggle-full-tank" type="checkbox" checked="" class="sr-only peer">
          <div class="w-11 h-6 bg-[#0B0F0D] border border-card-border peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:bg-textMain after:border-gray-300 after:border after:rounded-full after:h-[18px] after:w-[18px] after:transition-all peer-checked:bg-accent peer-checked:after:bg-[#04130A] peer-checked:after:border-transparent"></div>
        </label>
      </div>

      <!-- Fuel Grade / Station Tag (Glanceable Quick Pill Selector) -->
      <div class="flex items-center gap-2 pt-0.5 overflow-x-auto no-scrollbar">
        <span class="text-[10px] font-mono text-muted uppercase tracking-wider shrink-0">Brand:</span>
        <button type="button" class="px-2.5 py-1 rounded-lg bg-card border border-accent text-accent text-[11px] font-mono font-medium shrink-0 flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-accent"></span>
          Shell 91
        </button>
        <button type="button" class="px-2.5 py-1 rounded-lg bg-raised border border-card-border text-muted text-[11px] font-mono shrink-0 hover:text-textMain">
          Petron
        </button>
        <button type="button" class="px-2.5 py-1 rounded-lg bg-raised border border-card-border text-muted text-[11px] font-mono shrink-0 hover:text-textMain">
          Caltex
        </button>
        <button type="button" class="px-2.5 py-1 rounded-lg bg-raised border border-card-border text-muted text-[11px] font-mono shrink-0 hover:text-textMain">
          Cleanfuel
        </button>
      </div>

      <!-- Action Button: Full-width Green Save Button -->
      <div class="pt-2">
        <button type="button" class="w-full h-12 rounded-xl bg-accent text-accentText font-mono font-bold text-sm tracking-wider uppercase flex items-center justify-center gap-2 hover:bg-emerald-400 active:scale-[0.99] transition-all shadow-[0_0_20px_rgba(34,197,94,0.18)]">
          <!-- Checkmark Icon -->
          <svg class="w-4 h-4 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Save Fuel Entry</span>
        </button>
      </div>

      <!-- Offline Telemetry Status Banner -->
      

    </form>

  </div>

  <script>
    // Live auto-calculation logic for liters x price per liter
    const litersInput = document.getElementById('input-liters');
    const rateInput = document.getElementById('input-rate');
    const totalDisplay = document.getElementById('display-total');

    function calculateTotal() {
      const liters = parseFloat(litersInput.value) || 0;
      const rate = parseFloat(rateInput.value) || 0;
      const total = (liters * rate).toFixed(2);
      totalDisplay.textContent = total;
    }

    litersInput.addEventListener('input', calculateTotal);
    rateInput.addEventListener('input', calculateTotal);
  </script>




</body></html>
